  <link rel="stylesheet" href="style.css" />
  <script>
    // boot: choose quality + internal render size BEFORE the engine modules load (they size their render targets from __RES)
    (function () {
      var qs = new URLSearchParams(location.search), q = qs.get('q'), stored = null;
      try { stored = sessionStorage.getItem('demo.q'); } catch (e) {}
      var ua = navigator.userAgent, mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua));
      q = q || stored || (mobile ? 'low' : 'high');
      if (['high', 'mid', 'low'].indexOf(q) < 0) q = 'high';
      var budget = q === 'high' ? 2.07e6 : q === 'mid' ? 1.25e6 : 0.62e6;
      var vw = Math.max(320, innerWidth), vh = Math.max(320, innerHeight), dpr = Math.min(devicePixelRatio || 1, 2), a = vw / vh;
      var w = Math.sqrt(budget * a), h = w / a, k = Math.min(1, vw * dpr / w, vh * dpr / h);
      w = Math.round(w * k / 2) * 2; h = Math.round(h * k / 2) * 2;
      window.__RES = [w, h];
      window.__Q = { name: q, shadow: q === 'low' ? 2048 : 4096, mobile: mobile };
      window.__Lprof = q === 'low' ? { ao: false, shaft: false, dust: false, refl: false } : q === 'mid' ? { shaft: false, refl: false, dust: false } : { dust: false };
    })();
  </script>

  <script type="module" src="app.js"></script>
  <script>
    // WebGL 2 missing → say so instead of a blank page
    (function () { var c = document.createElement('canvas'); if (!c.getContext('webgl2')) { var m = document.getElementById('loadmsg'); if (m) m.textContent = '这个浏览器不支持 WebGL 2，请换用最新版 Chrome / Safari / Edge。 This browser does not support WebGL 2.'; } })();
    window.addEventListener('error', function (e) { var m = document.getElementById('loadmsg'); if (m && !window.__ready) m.textContent = '加载出错，请刷新重试 · Something went wrong, please reload.'; });
  </script>
